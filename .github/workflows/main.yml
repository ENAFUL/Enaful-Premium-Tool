name: Build Enaful APK with Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Cloud Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev bzip2

    - name: Install Android SDK Manager & Auto-Accept Licenses
      run: |
        mkdir -p mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d cmdline-tools
        mkdir -p ~/android-sdk/cmdline-tools/latest
        mv cmdline-tools/cmdline-tools/* ~/android-sdk/cmdline-tools/latest/
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "build-tools;33.0.1" "platforms;android-33"

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip setuptools
        pip install buildozer cython==0.29.33

    - name: Force Buildozer Config to Auto-Accept
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        # Buildozer রান হওয়ার সময় যাতে গুগলের লাইসেন্স নিয়ে আর কোনো প্রশ্ন না করতে পারে
        mkdir -p ~/.buildozer/android/platform/
        yes | buildozer -v android debug || true

    - name: Build Android APK (Final Run)
      run: |
        buildozer -v android debug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Enaful-Premium-APK
        path: bin/*.apk
