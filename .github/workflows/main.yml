name: Build Enaful APK with Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Cloud Repository
      uses: actions/checkout@v3

    - name: Get Date/Time
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

    - name: Cache Buildozer Global Directory
      uses: actions/cache@v3
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Build with Buildozer Actions
      uses: ArtemGovorov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer -v android debug
        repository_root: .

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Enaful-Premium-App-${{ steps.get-date.outputs.date }}
        path: ${{ steps.buildozer.outputs.filename }}
